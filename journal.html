<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADEZ - Trade Execution Journal</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --text-main: #e0e6ed;
            --text-dim: #788b9c;
            --border-color: #232a36;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .journal-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 24px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-green);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background-color: var(--accent-green);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: opacity 0.2s ease;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .status-banner {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 600;
        }

        .status-success {
            background-color: rgba(0, 230, 118, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .status-error {
            background-color: rgba(255, 82, 82, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }
    </style>
</head>
<body>

<div class="journal-container">
    <div class="brand-title">TRADZ // LOG EXECUTION</div>

    <form id="journalForm" onsubmit="saveTrade(event)">
        <div class="form-group">
            <label for="tradeDay">Trading Session / Day</label>
            <input type="text" id="tradeDay" placeholder="e.g. Monday - NY Open" required>
        </div>

        <div class="form-group">
            <label for="tradeLots">Position Size (Lots)</label>
            <input type="number" step="0.01" id="tradeLots" placeholder="e.g. 1.50" required>
        </div>

        <div class="form-group">
            <label for="tradeBias">Directional Bias</label>
            <select id="tradeBias" required>
                <option value="BULLISH">BULLISH (BUY)</option>
                <option value="BEARISH">BEARISH (SELL)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tradeResult">Outcome</label>
            <select id="tradeResult" required>
                <option value="WIN">WIN</option>
                <option value="LOSS">LOSS</option>
                <option value="BE">BREAKEVEN</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tradePnl">P&L ($ Amount)</label>
            <input type="number" step="0.01" id="tradePnl" placeholder="e.g. 450.00 or -150.00" required>
        </div>

        <button type="submit" class="submit-btn">LOG TRADE TO NOTION</button>
    </form>

    <div id="statusBanner" class="status-banner"></div>
</div>

<script>
async function saveTrade(e) {
    e.preventDefault();

    const banner = document.getElementById('statusBanner');
    banner.style.display = 'none';

    let day = document.getElementById('tradeDay').value;
    let lots = document.getElementById('tradeLots').value;
    let bias = document.getElementById('tradeBias').value;
    let result = document.getElementById('tradeResult').value;
    let pnl = parseFloat(document.getElementById('tradePnl').value);

    // Normalize PnL signs based on trade result
    if (result === 'LOSS' && pnl > 0) {
        pnl = -pnl;
    } else if (result === 'WIN' && pnl < 0) {
        pnl = Math.abs(pnl);
    }

    const tradeData = { day, lots, bias, result, pnl };

    // 1. Local Storage Backup
    let localTrades = JSON.parse(localStorage.getItem('trades')) || [];
    localTrades.push(tradeData);
    localStorage.setItem('trades', JSON.stringify(localTrades));

    // 2. Dispatch to Local Proxy Bridge Server
    try {
        const response = await fetch('http://localhost:3000/api/log-trade', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(tradeData)
        });

        const resData = await response.json();

        if (response.ok && resData.success) {
            showBanner('EXECUTION COMMITTED TO NOTION & LOCAL STORAGE', 'success');
            document.getElementById('journalForm').reset();
        } else {
            showBanner('SAVED LOCALLY (NOTION API ERROR: ' + (resData.error || 'Check server console') + ')', 'error');
        }
    } catch (err) {
        console.error('Fetch error:', err);
        showBanner('SAVED LOCALLY (SERVER OFFLINE - RUN node server.js)', 'error');
    }
}

function showBanner(message, type) {
    const banner = document.getElementById('statusBanner');
    banner.innerText = message;
    banner.className = 'status-banner ' + (type === 'success' ? 'status-success' : 'status-error');
    banner.style.display = 'block';
}
</script>

</body>
</html>
