<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADEZ - Trade Execution Journal</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --text-main: #e0e6ed;
            --text-dim: #788b9c;
            --border-color: #232a36;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .journal-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 24px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background-color: var(--accent-green);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .status-banner {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 600;
        }
        .status-success { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .status-error { background: rgba(255, 82, 82, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

        /* History Table Styling */
        .history-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th { color: var(--text-dim); text-transform: uppercase; font-size: 0.75rem; }

        .win { color: var(--accent-green); font-weight: bold; }
        .loss { color: var(--accent-red); font-weight: bold; }
    </style>
</head>
<body>

<div class="journal-container">
    <div class="brand-title">TRADZ // NEW EXECUTION</div>

    <form id="journalForm" onsubmit="saveTrade(event)">
        <div class="form-group">
            <label for="tradeDay">Trading Session / Day</label>
            <input type="text" id="tradeDay" placeholder="e.g. Monday - NY Open" required>
        </div>

        <div class="form-group">
            <label for="tradeLots">Position Size (Lots)</label>
            <input type="number" step="0.01" id="tradeLots" placeholder="e.g. 1.50" required>
        </div>

        <div class="form-group">
            <label for="tradeBias">Directional Bias</label>
            <select id="tradeBias" required>
                <option value="BULLISH">BULLISH (BUY)</option>
                <option value="BEARISH">BEARISH (SELL)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tradeResult">Outcome</label>
            <select id="tradeResult" required>
                <option value="WIN">WIN</option>
                <option value="LOSS">LOSS</option>
                <option value="BE">BREAKEVEN</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tradePnl">P&L ($ Amount)</label>
            <input type="number" step="0.01" id="tradePnl" placeholder="e.g. 450.00" required>
        </div>

        <button type="submit" class="submit-btn">LOG TO NOTION</button>
    </form>

    <div id="statusBanner" class="status-banner"></div>
</div>

<div class="history-container">
    <div class="brand-title" style="text-align:left; border:none; padding:0; margin-bottom:10px;">NOTION JOURNAL HISTORY</div>
    <table>
        <thead>
            <tr>
                <th>Day / Session</th>
                <th>Lots</th>
                <th>Bias</th>
                <th>Result</th>
                <th>P&L ($)</th>
            </tr>
        </thead>
        <tbody id="tradeHistoryBody">
            <tr><td colspan="5" style="text-align:center; color:var(--text-dim);">Loading entries from Notion...</td></tr>
        </tbody>
    </table>
</div>

<script>
document.addEventListener("DOMContentLoaded", loadNotionTrades);

async function loadNotionTrades() {
    const tbody = document.getElementById('tradeHistoryBody');
    try {
        const response = await fetch('/api/get-trades');
        const data = await response.json();

        if (response.ok && data.success) {
            if (data.trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-dim);">No past entries found.</td></tr>';
                return;
            }

            tbody.innerHTML = data.trades.map(t => `
                <tr>
                    <td>${t.day}</td>
                    <td>${t.lots}</td>
                    <td>${t.bias}</td>
                    <td class="${t.result === 'WIN' ? 'win' : t.result === 'LOSS' ? 'loss' : ''}">${t.result}</td>
                    <td class="${t.pnl >= 0 ? 'win' : 'loss'}">$${t.pnl.toFixed(2)}</td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--accent-red);">Failed to load history from Notion.</td></tr>';
        }
    } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--accent-red);">Error connecting to Notion.</td></tr>';
    }
}

async function saveTrade(e) {
    e.preventDefault();
    const banner = document.getElementById('statusBanner');
    banner.style.display = 'none';

    let day = document.getElementById('tradeDay').value;
    let lots = document.getElementById('tradeLots').value;
    let bias = document.getElementById('tradeBias').value;
    let result = document.getElementById('tradeResult').value;
    let pnl = parseFloat(document.getElementById('tradePnl').value);

    if (result === 'LOSS' && pnl > 0) pnl = -pnl;
    if (result === 'WIN' && pnl < 0) pnl = Math.abs(pnl);

    const tradeData = { day, lots, bias, result, pnl };

    try {
        const response = await fetch('/api/log-trade', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(tradeData)
        });

        const resData = await response.json();

        if (response.ok && resData.success) {
            showBanner('LOGGED TO NOTION SUCCESSFULLY', 'success');
            document.getElementById('journalForm').reset();
            loadNotionTrades(); // Refresh history instantly
        } else {
            showBanner('ERROR: ' + (resData.error || 'Check logs'), 'error');
        }
    } catch (err) {
        showBanner('SYNC ERROR', 'error');
    }
}

function showBanner(message, type) {
    const banner = document.getElementById('statusBanner');
    banner.innerText = message;
    banner.className = 'status-banner ' + (type === 'success' ? 'status-success' : 'status-error');
    banner.style.display = 'block';
}
</script>

</body>
</html>
