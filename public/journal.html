<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADEZ - Notion Execution Journal</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --text-main: #e0e6ed;
            --text-dim: #788b9c;
            --border-color: #232a36;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .journal-container, .history-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .form-group { margin-bottom: 8px; }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
        }

        .submit-btn {
            grid-column: 1 / -1;
            padding: 14px;
            margin-top: 10px;
            background-color: var(--accent-green);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .status-banner {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 600;
        }
        .status-success { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .status-error { background: rgba(255, 82, 82, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        th { color: var(--text-dim); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.5px; }

        .tag {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .tag-buy { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); }
        .tag-sell { background: rgba(255, 82, 82, 0.15); color: var(--accent-red); }
        .win { color: var(--accent-green); font-weight: bold; }
        .loss { color: var(--accent-red); font-weight: bold; }
    </style>
</head>
<body>

<div class="journal-container">
    <div class="brand-title">LOG NEW EXECUTION</div>

    <form id="journalForm" onsubmit="saveTrade(event)">
        <div class="form-grid">
            <div class="form-group">
                <label for="tradeTitle">Title</label>
                <input type="text" id="tradeTitle" placeholder="e.g. London Setup" required>
            </div>

            <div class="form-group">
                <label for="tradeDate">Date</label>
                <input type="date" id="tradeDate" required>
            </div>

            <div class="form-group">
                <label for="tradeAsset">Asset</label>
                <select id="tradeAsset" required>
                    <option value="sp500">sp500</option>
                    <option value="nas100">nas100</option>
                    <option value="eurusd">eurusd</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tradeType">Type</label>
                <select id="tradeType" required>
                    <option value="Buy">Buy</option>
                    <option value="Sell">Sell</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tradeBias">Bias</label>
                <select id="tradeBias" required>
                    <option value="Bullish">Bullish</option>
                    <option value="Bearish">Bearish</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tradeResult">Result</label>
                <select id="tradeResult" required>
                    <option value="Win">Win</option>
                    <option value="Loss">Loss</option>
                    <option value="BE">BE</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tradeTp">Tp (Target)</label>
                <select id="tradeTp" required>
                    <option value="High">High</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tradePnl">PNL (%)</label>
                <input type="number" step="0.1" id="tradePnl" placeholder="e.g. 1.8" required>
            </div>

            <button type="submit" class="submit-btn">LOG TO NOTION</button>
        </div>
    </form>

    <div id="statusBanner" class="status-banner"></div>
</div>

<div class="history-container">
    <div class="brand-title">NOTION JOURNAL HISTORY</div>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Title</th>
                <th>Asset</th>
                <th>Type</th>
                <th>Bias</th>
                <th>Result</th>
                <th>Tp</th>
                <th>PNL (%)</th>
            </tr>
        </thead>
        <tbody id="tradeHistoryBody">
            <tr><td colspan="8" style="text-align:center; color:var(--text-dim);">Loading entries from Notion...</td></tr>
        </tbody>
    </table>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById('tradeDate').valueAsDate = new Date();
    loadNotionTrades();
});

async function loadNotionTrades() {
    const tbody = document.getElementById('tradeHistoryBody');
    try {
        const response = await fetch('/api/get-trades');
        
        if (!response.ok) {
            const errText = await response.text();
            let errMsg = `HTTP ${response.status}`;
            try {
                const parsed = JSON.parse(errText);
                if (parsed.error) errMsg = parsed.error;
            } catch (e) {}
            
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--accent-red);">Error (${response.status}): ${errMsg}</td></tr>`;
            return;
        }

        const data = await response.json();

        if (data.success) {
            if (!data.trades || data.trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:var(--text-dim);">No trades found in Notion database.</td></tr>';
                return;
            }

            tbody.innerHTML = data.trades.map(t => `
                <tr>
                    <td>${t.date}</td>
                    <td>${t.title}</td>
                    <td>${t.asset}</td>
                    <td><span class="tag ${t.type === 'Buy' ? 'tag-buy' : 'tag-sell'}">${t.type}</span></td>
                    <td>${t.bias}</td>
                    <td class="${t.result === 'Win' ? 'win' : t.result === 'Loss' ? 'loss' : ''}">${t.result}</td>
                    <td>${t.tp}</td>
                    <td class="${t.pnl >= 0 ? 'win' : 'loss'}">${t.pnl}%</td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--accent-red);">${data.error || 'Failed to load entries.'}</td></tr>`;
        }
    } catch (err) {
        console.error('Fetch Exception:', err);
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--accent-red);">Network Error: ${err.message}</td></tr>`;
    }
}

async function saveTrade(e) {
    e.preventDefault();
    const banner = document.getElementById('statusBanner');
    banner.style.display = 'none';

    const tradeData = {
        title: document.getElementById('tradeTitle').value,
        date: document.getElementById('tradeDate').value,
        asset: document.getElementById('tradeAsset').value,
        type: document.getElementById('tradeType').value,
        bias: document.getElementById('tradeBias').value,
        result: document.getElementById('tradeResult').value,
        tp: document.getElementById('tradeTp').value,
        pnl: parseFloat(document.getElementById('tradePnl').value)
    };

    try {
        const response = await fetch('/api/log-trade', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(tradeData)
        });

        const resData = await response.json();

        if (response.ok && resData.success) {
            showBanner('LOGGED TO NOTION SUCCESSFULLY', 'success');
            document.getElementById('journalForm').reset();
            document.getElementById('tradeDate').valueAsDate = new Date();
            loadNotionTrades();
        } else {
            showBanner('ERROR: ' + (resData.error || 'Check logs'), 'error');
        }
    } catch (err) {
        showBanner('SYNC ERROR', 'error');
    }
}

function showBanner(message, type) {
    const banner = document.getElementById('statusBanner');
    banner.innerText = message;
    banner.className = 'status-banner ' + (type === 'success' ? 'status-success' : 'status-error');
    banner.style.display = 'block';
}
</script>

</body>
</html>
